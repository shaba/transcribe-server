[package]
name = "transcribe-server"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "OpenAI-compatible speech-to-text server on top of transcribe.cpp"

[features]
default = []
engine-transcribe = []
audio-ffmpeg = []

[dependencies]
# added later in their tasks as optional:
# transcribe-cpp = { version = "...", optional = true }
# ffmpeg-next = { version = "...", optional = true }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
