[package]
name = "transcribe-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "OpenAI-compatible speech-to-text server on top of transcribe.cpp"

[features]
default = ["audio-ffmpeg"]
engine-transcribe = ["dep:transcribe-cpp"]
audio-ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "ws"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
ffmpeg-next = { version = "8.1.0", optional = true, default-features = false, features = ["codec", "format", "software-resampling"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transcribe-cpp = { version = "0.1.3", optional = true }

[dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream", "rustls"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

# Linking mode 2 (see README "Linking modes"): build against a patched
# transcribe.cpp checkout instead of crates.io. The patch only applies when the
# patched version satisfies the transcribe-cpp requirement above, so bump that
# requirement if the checkout is newer. Pick ONE of the two variants below and
# leave the other commented: uncommenting both is invalid TOML (duplicate keys).
# Git variant:
# [patch.crates-io]
# transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "<commit>" }
# transcribe-cpp-sys = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "<commit>" }
# Local-path variant (the -sys manifest sits at the transcribe.cpp repo root):
# [patch.crates-io]
# transcribe-cpp = { path = "/path/to/transcribe.cpp/bindings/rust/transcribe-cpp" }
# transcribe-cpp-sys = { path = "/path/to/transcribe.cpp" }
