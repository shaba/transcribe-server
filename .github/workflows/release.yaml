# Kept in sync with .forgejo/workflows/release.yaml: a tag push creates a
# release with notes only. No binaries and no source tarballs are uploaded;
# the forge attaches the source archives itself.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: nothing from the tree is needed, the release is created
      # through the API.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
