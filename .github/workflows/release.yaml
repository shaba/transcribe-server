# Kept in sync with .forgejo/workflows/release.yaml: same jobs, same steps,
# same order. Only the forge API differs; the notes themselves come from the
# one script both files call, so the two pages cannot say different things.
#
# A tag push creates a release whose body is that version's NEWS.md section.
# No binaries and no source tarballs are uploaded; the forge attaches the
# source archives itself.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The notes come from the default branch, not from the tag's own tree:
      # a NEWS.md section is often written after the tag is cut, and an older
      # tag predates the file entirely. Full history so the fallback can list
      # the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Collect release notes
        env:
          TAG: ${{ github.ref_name }}
        run: tools/release-notes.sh body "$TAG" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A tag can be moved while a version is being prepared, and the second
        # push must not fail: creating a release for a tag that already has one
        # is an HTTP 422. Refresh the notes of the existing release instead --
        # the release itself follows the tag, so it already points at the new
        # commit.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
