# Kept in sync with .github/workflows/release.yaml: same jobs, same steps,
# same order. Only the forge API differs; the notes themselves come from the
# one script both files call, so the two pages cannot say different things.
#
# A tag push creates a release whose body is that version's NEWS.md section.
# No binaries and no source tarballs are uploaded; the forge attaches the
# source archives itself.
#
# One deliberate difference from the GitHub file: Forgejo matches tag filters
# with glob semantics (no "+" quantifier), so the semver pattern is spelled
# with "*".
name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  release:
    runs-on: als-huge
    steps:
      # jq builds the request body. NEWS.md is markdown -- quotes, backslashes,
      # tabs inside code blocks -- and hand-escaping that into a JSON string
      # produces a malformed request rather than a bad-looking page.
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y curl git jq
      # Full history: the notes script falls back to the commits since the
      # previous tag when NEWS.md has no section for this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # A tag can be moved while a version is being prepared, and the second
        # push must not fail: POSTing a release for a tag that already has one
        # is rejected. Patch the existing release in that case -- it follows the
        # tag, so it already points at the new commit.
        run: |
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases"
          tools/release-notes.sh body "$TAG" > release-notes.md
          jq -n --arg tag "$TAG" --rawfile body release-notes.md \
            '{tag_name: $tag, name: $tag, body: $body}' > release.json
          id=$(curl -fsS -H "Authorization: token $FORGE_TOKEN" "$api/tags/$TAG" \
                 | jq -r '.id // empty') || id=
          if [ -n "$id" ]; then
            curl -fsS -X PATCH \
              -H "Authorization: token $FORGE_TOKEN" \
              -H "Content-Type: application/json" \
              -d @release.json "$api/$id"
          else
            curl -fsS -X POST \
              -H "Authorization: token $FORGE_TOKEN" \
              -H "Content-Type: application/json" \
              -d @release.json "$api"
          fi
